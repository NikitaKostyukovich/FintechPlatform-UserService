spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: JavaAdvancedProject
  profiles:
    active: local
  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 20
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  cache:
    type: redis
    redis:
      time-to-live: 600000
server:
  port: 8081


