databaseChangeLog:
  - changeSet:
      id: 005-add-users-name-surname-lower-index
      author: nikita_kostyukovich
      changes:
        - sql:
            sql: DROP INDEX IF EXISTS idx_user_name_surname;
        - sql:
            sql: CREATE INDEX idx_user_name_surname_lower ON users (LOWER(name), LOWER(surname));
